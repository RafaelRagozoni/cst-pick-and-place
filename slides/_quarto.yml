project:
  type: default
  output-dir: _saida
  render:
    - reunioes/*.qmd
    - revisao/*.qmd
    - teste/exemplo.qmd
  resources:
    - tema/fontes/*.otf
    # videos sit in raw <video> tags, which Quarto does not copy by itself
    - mudancas/*/media/*.mp4
    - reunioes/*/media/*.mp4
    - teste/media/*.mp4

lang: pt-BR

format:
  revealjs:
    width: 1280
    height: 720
    margin: 0
    center: false
    transition: none
    hash: true
    fragment-in-url: true
    slide-number: c/t
    controls: false
    menu: false
    progress: false
    theme: [default, tema/apr.scss]
    include-after-body: tema/secoes.html
